name: Android debug APK
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        run: gradle :app:assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: ghostreader-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

  signed-release:
    if: ${{ vars.GHOSTREADER_SIGNING_READY == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Restore private signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.GHOSTREADER_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/ghostreader-release.jks"
      - name: Build signed release APK
        env:
          GHOSTREADER_KEYSTORE_PATH: ${{ runner.temp }}/ghostreader-release.jks
          GHOSTREADER_STORE_PASSWORD: ${{ secrets.GHOSTREADER_STORE_PASSWORD }}
          GHOSTREADER_KEY_ALIAS: ${{ secrets.GHOSTREADER_KEY_ALIAS }}
          GHOSTREADER_KEY_PASSWORD: ${{ secrets.GHOSTREADER_KEY_PASSWORD }}
        run: gradle :app:assembleRelease --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: ghostreader-signed-release-apk
          path: app/build/outputs/apk/release/app-release.apk
